[package]
name = "aether-init"
description = "Aether native user space: init, linuxd, and the terminal userland"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "aether-init"
path = "src/main.rs"

[[bin]]
name = "aether-linuxd"
path = "src/bin/linuxd.rs"

[[bin]]
name = "aether-userland"
path = "src/bin/userland/main.rs"

[dependencies]
aether-abi = { path = "../abi" }
aether-sdk = { path = "../sdk" }

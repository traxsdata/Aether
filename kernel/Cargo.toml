[package]
name = "aether-kernel"
description = "Aether x86-64 kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-abi = { path = "../abi" }
aether-appimage = { path = "../apps/linux/appimage" }
aether-linux-elf = { path = "../apps/linux/elf" }
aether-squashfs = { path = "../apps/linux/squashfs" }
aether-boot-common = { path = "../boot/common" }
aether-fs = { path = "fs" }
aether-memory = { path = "memory" }
aether-ipc = { path = "ipc" }
aether-input = { path = "input" }
aether-services = { path = "services" }
aether-wm = { path = "wm" }
aether-crypto = { path = "../crypto" }
aether-packaging = { path = "../packaging" }
aether-update = { path = "../updates" }

[features]
# Boot with a deliberate breakpoint to exercise the exception path.
fault-selftest = []
# Boot with a rollback self-test that removes the current image marker and
# re-selects, exercising the lost-image branch on every test boot.
recovery-rollback-selftest = []
# Boot the Gate 4 portal slice with a seeded workbook grant and a test-only
# revocation control path. Not part of the normal kernel feature set.
gate4-portal-test = []
# Gate 4 staged Mesa/lavapipe rootfs needs more import heap than the embedded
# Gate 3 fixture. The boot image also needs more guest RAM.
gate4-runtime = []

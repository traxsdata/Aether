[package]
name = "aether-kernel"
description = "Aether x86-64 kernel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-abi = { path = "../abi" }
aether-appimage = { path = "../apps/linux/appimage" }
aether-linux-elf = { path = "../apps/linux/elf" }
aether-squashfs = { path = "../apps/linux/squashfs" }
aether-boot-common = { path = "../boot/common" }
aether-fs = { path = "fs" }
aether-memory = { path = "memory" }
aether-ipc = { path = "ipc" }
aether-net = { path = "net" }
aether-input = { path = "input" }
aether-services = { path = "services" }
aether-wm = { path = "wm" }
aether-crypto = { path = "../crypto" }
aether-packaging = { path = "../packaging" }
aether-update = { path = "../updates" }
smoltcp = { version = "0.14", default-features = false, features = ["alloc", "medium-ethernet", "proto-ipv4", "proto-dhcpv4", "socket-tcp", "socket-udp", "socket-dhcpv4", "socket-icmp"] }

[features]
# Boot with a network self-test: DHCP, then fetch a page from the QEMU
# user-network host (10.0.2.2) over TCP.
net-selftest = []
net-consent-test = []
# Boot with a deliberate breakpoint to exercise the exception path.
fault-selftest = []
# Boot with a user-copy fault on a kernel address, which must still halt.
usercopy-fault-selftest = []
# Boot with a direct ring-0 read of a user page, which SMAP must stop.
smap-fault-selftest = []
# Fault on an unmapped kernel address after a successful boot, so the crash
# report must replace the desktop.
crash-screen-selftest = []
# Panic right after graphics init to exercise the panic path of the report.
crash-screen-panic-selftest = []
# Boot with a rollback self-test that removes the current image marker and
# re-selects, exercising the lost-image branch on every test boot.
recovery-rollback-selftest = []
# Boot the Gate 4 portal slice with a seeded workbook grant and a test-only
# revocation control path. Not part of the normal kernel feature set.
gate4-portal-test = []
# Gate 4 staged Mesa/lavapipe rootfs needs more import heap than the embedded
# Gate 3 fixture. The boot image also needs more guest RAM.
gate4-runtime = []
# Boot the Gate 4 GUI portal slice with a real XLSX grant, immediate save
# evidence, and kernel-driven post-exit revocation checks.
gate4-gui-test = ["aether-memory/gate4"]
# Linux-sized mapping limits for large applications such as Firefox.
large-apps = ["aether-memory/large-apps"]

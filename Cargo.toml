[workspace]
resolver = "3"
members = [
    "abi",
    "apps/linux/appimage",
    "apps/linux/squashfs",
    "boot/common",
    "crypto",
    "boot/loader",
    "kernel",
    "kernel/fs",
    "kernel/memory",
    "kernel/ipc",
    "kernel/input",
    "kernel/services",
    "kernel/wm",
    "packaging",
    "sdk",
    "tests/compatibility",
    "tests/rendering",
    "tools/admin",
    "updates",
    "user",
]
# The kernel, loader, SDK, and user program require bare-metal/UEFI targets, so
# only the host-testable crates are part of a default `cargo test`.
default-members = [
    "abi",
    "apps/linux/appimage",
    "apps/linux/squashfs",
    "boot/common",
    "crypto",
    "kernel/fs",
    "kernel/memory",
    "kernel/ipc",
    "kernel/input",
    "kernel/services",
    "kernel/wm",
    "packaging",
    "tests/compatibility",
    "tests/rendering",
    "updates",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/traxsdata/Aether"
authors = ["Aether contributors"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2
debug = 2
strip = false

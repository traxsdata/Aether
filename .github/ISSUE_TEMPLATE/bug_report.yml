name: Bug report
description: Report something that does not work as documented
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. Use the private reporting link on the issue chooser or see SECURITY.md.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the actual behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. make ...
        2. ...
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: Output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: input
    id: host-os
    attributes:
      label: Host OS
      placeholder: Ubuntu 24.04 x86-64
    validations:
      required: true
  - type: input
    id: qemu-version
    attributes:
      label: QEMU version
      description: Output of `qemu-system-x86_64 --version`.
  - type: input
    id: make-target
    attributes:
      label: Make target
      description: The target you ran, for example `make test`.
  - type: textarea
    id: serial-log
    attributes:
      label: Serial log excerpt
      description: Relevant lines from the serial output.
      render: text

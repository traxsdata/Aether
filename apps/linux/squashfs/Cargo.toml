[package]
name = "aether-squashfs"
description = "Bounded SquashFS 4 reader for Aether's Linux AppImage import"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aether-appimage = { path = "../appimage" }
ruzstd = { version = "0.9.1", default-features = false }
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }
lz4_flex = { version = "0.14", default-features = false, features = ["alloc", "safe-decode"] }
lzma-rs = { version = "0.3", optional = true }

[features]
default = ["std"]
# Host import support for SquashFS xz/lzma blocks. The in-OS reader will need a
# no_std decoder or build this feature into the runtime rootfs service.
std = ["dep:lzma-rs"]

[[bin]]
name = "squashfs-extract"
path = "src/bin/extract.rs"

[lints.rust]
unsafe_code = "forbid"
